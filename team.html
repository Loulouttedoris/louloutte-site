<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Affiliés</title>

    <style>
        /* --- BACKGROUND --- */
        body { 
            margin: 0; 
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            color: white; 
            font-family: Arial; 
            text-align: center; 
            animation: fadeIn 0.8s ease-in-out;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        /* --- TRANSITION ENTRE PAGES --- */
        html {
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        html.loaded {
            opacity: 1;
        }

        /* --- NAVIGATION --- */
        nav { 
            text-align: center; 
            padding: 20px; 
            background: rgba(17, 17, 17, 0.8);
        }

        nav a { 
            color: white; 
            margin: 0 20px; 
            text-decoration: none; 
            font-size: 20px; 
            transition: 0.3s;
        }

        nav a:hover { 
            color: #9146FF;
            text-shadow: 0 0 10px #9146FF;
        }

        /* --- TITRE NÉON --- */
        h1 { 
            margin-top: 40px; 
            color: #9146FF; 
            font-size: 40px;
            text-shadow: 0 0 10px #9146FF,
                         0 0 20px #9146FF,
                         0 0 40px #b57aff;
            animation: neonPulse 2s infinite alternate;
        }

        @keyframes neonPulse {
            from {
                text-shadow: 0 0 10px #9146FF,
                             0 0 20px #9146FF,
                             0 0 40px #b57aff;
            }

            to {
                text-shadow: 0 0 20px #b57aff,
                             0 0 40px #d2a8ff,
                             0 0 60px #ffffff;
            }
        }

        /* --- TEAM GRID --- */
        .team-container {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        .member {
            text-align: center;
        }

        /* --- AVATARS --- */
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #9146FF;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.1);
        }

        /* --- ÉTAT LIVE --- */
        .live {
            box-shadow: 0 0 20px red, 0 0 40px red;
        }

        /* --- NOM --- */
        .name {
            margin-top: 10px;
            font-size: 18px;
        }

        /* --- FADE IN --- */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="team.html">Affiliés</a>
    </nav>

    <h1>Affiliés Twitch</h1>

    <div class="team-container" id="team"></div>

    <script>

        /* ==========================================
           LISTE DES STREAMERS
           
           Pour ajouter un streamer :
           ajoute simplement son pseudo entre guillemets.
           ========================================== */

        const streamers = [
            "louloutte_doris",
            "adren4line_",
            "steroban_tv",
            "serizawa5714",
            "pikharleyquinn",
            "micky__rcs67"
        ];


        /* ==========================================
           CRÉATION DES PROFILS
           ========================================== */

        const team = document.getElementById("team");

        async function createStreamer(username) {

            const member = document.createElement("div");
            member.className = "member";

            const avatar = document.createElement("img");
            avatar.className = "avatar";
            avatar.alt = username;

            const name = document.createElement("div");
            name.className = "name";
            name.textContent = username;

            member.appendChild(avatar);
            member.appendChild(name);
            team.appendChild(member);


            /* Récupération de l'adresse de l'avatar Twitch */
            try {

                const avatarResponse = await fetch(
                    "https://decapi.me/twitch/avatar/" + username
                );

                const avatarUrl = await avatarResponse.text();

                avatar.src = avatarUrl.trim();

            } catch (error) {

                console.log(
                    "Impossible de récupérer l'avatar de " + username
                );

            }


            /* Lien vers Twitch */
            member.style.cursor = "pointer";

            member.addEventListener("click", function() {

                window.open(
                    "https://www.twitch.tv/" + username,
                    "_blank",
                    "noopener,noreferrer"
                );

            });


            /* Vérification du live */
            try {

                const response = await fetch(
                    "https://decapi.me/twitch/uptime/" + username
                );

                const text = await response.text();

                if (!text.toLowerCase().includes("offline")) {

                    avatar.classList.add("live");

                    name.textContent = username + " - en live";

                }

            } catch (error) {

                console.log(
                    "Impossible de vérifier le live de " + username
                );

            }

        }


        /* ==========================================
           CHARGEMENT DES STREAMERS
           ========================================== */

        async function loadStreamers() {

            for (const username of streamers) {

                await createStreamer(username);

            }

        }

        loadStreamers();


        /* ==========================================
           ANIMATION DE LA PAGE
           ========================================== */

        window.onload = () => {

            document.documentElement.classList.add("loaded");

        };

    </script>

</body>
</html>
