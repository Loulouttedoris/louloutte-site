<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Les Affiliés Twitch - Team Louloutte 💜</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, sans-serif;
    color: white;
}

body {
    background:
        linear-gradient(rgba(10, 5, 20, 0.75), rgba(10, 5, 20, 0.75)),
        url("https://loulouttedoris.github.io/louloutte-site/background.png") center/cover fixed no-repeat;

    animation: fadeIn 0.6s ease-in;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

/* NAVIGATION */

nav {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 20px 10px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    background: rgba(120, 60, 180, 0.35);
    border: 1px solid rgba(190, 120, 255, 0.5);
    padding: 10px 18px;
    border-radius: 10px;
    transition: 0.25s;
}

nav a:hover {
    background: rgba(150, 80, 220, 0.6);
    transform: translateY(-2px);
}

/* CONTENU */

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    text-align: center;
}

.logo {
    width: 180px;
    max-width: 80%;
    margin-bottom: 10px;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
    text-shadow: 0 0 15px rgba(180, 100, 255, 0.7);
}

.intro {
    max-width: 700px;
    margin: 0 auto 35px;
    line-height: 1.6;
    color: #ddd;
}

/* AFFILIÉS */

.team-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
}

.member {
    width: 190px;
    padding: 20px 15px;
    background: rgba(20, 10, 35, 0.75);
    border: 1px solid rgba(170, 90, 255, 0.6);
    border-radius: 15px;
    text-decoration: none;
    color: white;
    transition: 0.3s;
}

.member:hover {
    transform: translateY(-7px);
    box-shadow: 0 0 20px rgba(170, 90, 255, 0.55);
}

.avatar {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #a855f7;
    display: block;
    margin: 0 auto 15px;
}

.member.live .avatar {
    border-color: #ff3b3b;
    box-shadow: 0 0 18px rgba(255, 50, 50, 0.7);
}

.member h2 {
    font-size: 18px;
    margin: 8px 0;
    word-break: break-word;
}

.live-status {
    font-size: 14px;
    min-height: 20px;
    color: #aaa;
}

.member.live .live-status {
    color: #ff4b4b;
    font-weight: bold;
}

/* MOBILE */

@media (max-width: 600px) {

    nav {
        gap: 8px;
    }

    nav a {
        padding: 9px 12px;
        font-size: 14px;
    }

    h1 {
        font-size: 26px;
    }

    .team-container {
        gap: 15px;
    }

    .member {
        width: 160px;
        padding: 15px 10px;
    }

    .avatar {
        width: 125px;
        height: 125px;
    }

    .member h2 {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<nav>
    <a href="/louloutte-site/index.html">Accueil</a>
    <a href="/louloutte-site/team.html">Affiliés Twitch</a>
    <a href="/louloutte-site/louloutte.html">Mon Live</a>
</nav>

<div class="container">

    <img
        src="https://loulouttedoris.github.io/louloutte-site/logo.png"
        alt="Logo Louloutte"
        class="logo"
    >

    <h1>Les Affiliés de la Team Louloutte 💜</h1>

    <p class="intro">
        Découvrez les créateurs qui font partie de la Team Louloutte.<br>
        Cliquez sur un profil pour découvrir sa chaîne Twitch et soutenir son univers.
    </p>

    <div class="team-container" id="team"></div>

</div>

<script>

const streamers = [
    "louloutte_doris",
    "adren4line_",
    "steroban_tv",
    "serizawa5714",
    "pikharleyquinn",
    "micky__rcs67"
];

const team = document.getElementById("team");

streamers.forEach(username => {

    const member = document.createElement("a");

    member.className = "member";
    member.href = "https://www.twitch.tv/" + username;
    member.target = "_blank";
    member.rel = "noopener noreferrer";

    const avatar = document.createElement("img");

    avatar.className = "avatar";
    avatar.alt = "Avatar de " + username;

    /*
       DecAPI renvoie l'URL de l'avatar Twitch.
       On récupère d'abord cette URL, puis on la donne à l'image.
    */

    fetch("https://decapi.me/twitch/avatar/" + username)
        .then(response => response.text())
        .then(avatarUrl => {
            avatar.src = avatarUrl.trim();
        })
        .catch(() => {
            console.error("Impossible de récupérer l'avatar de " + username);
        });

    const name = document.createElement("h2");
    name.textContent = username;

    const status = document.createElement("div");
    status.className = "live-status";
    status.textContent = "Hors ligne";

    member.appendChild(avatar);
    member.appendChild(name);
    member.appendChild(status);

    team.appendChild(member);

    /*
       Vérification du statut Twitch
    */

    fetch("https://decapi.me/twitch/uptime/" + username)
        .then(response => response.text())
        .then(data => {

            const result = data.toLowerCase();

            if (
                result &&
                !result.includes("offline") &&
                !result.includes("not live")
            ) {
                member.classList.add("live");
                status.textContent = "🔴 EN LIVE";
            }

        })
        .catch(() => {
            status.textContent = "Hors ligne";
        });

});

</script>

</body>
</html>
