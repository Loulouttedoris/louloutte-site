<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiliés Twitch - Team Louloutte</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        linear-gradient(rgba(15, 5, 25, 0.78), rgba(15, 5, 25, 0.88)),
        url("https://loulouttedoris.github.io/louloutte-site/background.png")
        center / cover fixed no-repeat;
    text-align: center;

    /* Fade général de la page */
    animation: fadeIn 0.6s ease-in;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

nav {
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 20px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    background: rgba(120, 40, 180, 0.35);
    border: 1px solid #a855f7;
    padding: 10px 18px;
    border-radius: 10px;
    transition: 0.25s;
}

nav a:hover {
    background: rgba(168, 85, 247, 0.65);
    box-shadow: 0 0 15px rgba(168, 85, 247, 0.7);
    transform: translateY(-2px);
}

.container {
    width: 94%;
    max-width: 1100px;
    margin: 30px auto 50px;
    padding: 35px 25px;
    background: rgba(15, 5, 25, 0.65);
    border: 1px solid rgba(168, 85, 247, 0.5);
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(120, 40, 180, 0.25);
}

h1 {
    color: #d8b4fe;
    font-size: 32px;
    margin: 10px 0 15px;
}

.intro {
    max-width: 750px;
    margin: 0 auto 35px;
    line-height: 1.6;
    color: #f3e8ff;
    font-size: 16px;
}

.team-container {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 30px;
    flex-wrap: wrap;
}

.member {
    width: 190px;
    padding: 20px 15px;
    background: rgba(30, 10, 45, 0.75);
    border: 1px solid rgba(168, 85, 247, 0.65);
    border-radius: 15px;
    cursor: pointer;
    transition: 0.25s;
}

.member:hover {
    transform: translateY(-5px);
    border-color: #c084fc;
    box-shadow: 0 0 22px rgba(168, 85, 247, 0.55);
}

.avatar {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #a855f7;
    display: block;
    margin: 0 auto 15px;
    transition: 0.25s;
}

.member:hover .avatar {
    box-shadow: 0 0 18px rgba(168, 85, 247, 0.6);
}

.avatar.live {
    border-color: #ff3030;
    box-shadow: 0 0 18px rgba(255, 48, 48, 0.7);
}

.member-name {
    font-size: 17px;
    font-weight: bold;
    color: #f3e8ff;
    word-break: break-word;
}

.live-status {
    margin-top: 8px;
    min-height: 20px;
    color: #ff4d4d;
    font-size: 13px;
    font-weight: bold;
}

@media (max-width: 700px) {
    .container {
        width: 94%;
        padding: 25px 12px;
        margin-top: 15px;
    }

    h1 {
        font-size: 26px;
    }

    .intro {
        font-size: 15px;
    }

    .team-container {
        gap: 18px;
    }

    .member {
        width: 160px;
        padding: 16px 10px;
    }

    .avatar {
        width: 125px;
        height: 125px;
    }

    .member-name {
        font-size: 15px;
    }
}

@media (max-width: 400px) {
    .member {
        width: 145px;
    }

    .avatar {
        width: 115px;
        height: 115px;
    }
}
</style>
</head>

<body>

<nav>
    <a href="/louloutte-site/index.html">Accueil</a>
    <a href="/louloutte-site/team.html">Affiliés Twitch</a>
    <a href="/louloutte-site/louloutte.html">Mon Live</a>
</nav>

<div class="container">

    <h1>Les Affiliés de la Team Louloutte 💜</h1>

    <div class="intro">
        Découvrez les créateurs qui font partie de la Team Louloutte.
        Cliquez sur un profil pour découvrir sa chaîne Twitch et soutenir son univers.
    </div>

    <div class="team-container" id="team"></div>

</div>

<script>
const streamers = [
    "louloutte_doris",
    "adren4line_",
    "steroban_tv",
    "serizawa5714",
    "pikharleyquinn",
    "micky__rcs67"
];

const team = document.getElementById("team");

streamers.forEach(username => {

    const member = document.createElement("div");
    member.className = "member";

    member.onclick = () => {
        window.open(
            "https://www.twitch.tv/" + username,
            "_blank",
            "noopener,noreferrer"
        );
    };

    const avatar = document.createElement("img");
    avatar.className = "avatar";
    avatar.alt = "Avatar de " + username;
    avatar.src = "https://decapi.me/twitch/avatar/" + username;

    const name = document.createElement("div");
    name.className = "member-name";
    name.textContent = username;

    const status = document.createElement("div");
    status.className = "live-status";

    member.appendChild(avatar);
    member.appendChild(name);
    member.appendChild(status);

    team.appendChild(member);

    fetch("https://decapi.me/twitch/uptime/" + username)
        .then(response => response.text())
        .then(data => {

            if (
                data &&
                !data.toLowerCase().includes("offline") &&
                !data.toLowerCase().includes("not live")
            ) {
                avatar.classList.add("live");
                status.textContent = "🔴 EN LIVE";
            }

        })
        .catch(() => {
            // Le profil reste affiché si le statut ne peut pas être récupéré.
        });
});
</script>

</body>
</html>
