<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Affiliés</title>

    <style>
        /* --- BACKGROUND --- */
        body { 
            margin: 0; 
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            color: white; 
            font-family: Arial; 
            text-align: center; 
            animation: fadeIn 0.8s ease-in-out;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        /* --- TRANSITION ENTRE PAGES --- */
        html {
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }
        html.loaded {
            opacity: 1;
        }

        /* --- NAVIGATION --- */
        nav { 
            text-align: center; 
            padding: 20px; 
            background: rgba(17, 17, 17, 0.8);
        }

        nav a { 
            color: white; 
            margin: 0 20px; 
            text-decoration: none; 
            font-size: 20px; 
            transition: 0.3s;
        }

        nav a:hover { 
            color: #9146FF;
            text-shadow: 0 0 10px #9146FF;
        }

        /* --- TITRE NÉON --- */
        h1 { 
            margin-top: 40px; 
            color: #9146FF; 
            font-size: 40px;
            text-shadow: 0 0 10px #9146FF, 0 0 20px #9146FF, 0 0 40px #b57aff;
            animation: neonPulse 2s infinite alternate;
        }

        @keyframes neonPulse {
            from {
                text-shadow: 0 0 10px #9146FF, 0 0 20px #9146FF, 0 0 40px #b57aff;
            }
            to {
                text-shadow: 0 0 20px #b57aff, 0 0 40px #d2a8ff, 0 0 60px #ffffff;
            }
        }

        /* --- TEAM GRID --- */
        .team-container {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        .member {
            text-align: center;
        }

        /* --- AVATARS ANIMÉS --- */
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #9146FF;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.1);
        }

        /* --- ÉTAT LIVE --- */
        .live {
            box-shadow: 0 0 20px red, 0 0 40px red;
        }

        /* --- NOM --- */
        .name {
            margin-top: 10px;
            font-size: 18px;
        }

        /* --- FADE IN --- */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="team.html">Affiliés</a>
    </nav>

    <h1>Affiliés Twitch</h1>

    <div class="team-container">

        <div class="member">
            <img id="avatar-louloutte" class="avatar" src="louloutte1.png">
            <div class="name">louloutte_doris</div>
        </div>

        <div class="member">
            <img id="avatar-adre" class="avatar" src="adre.jpg">
            <div class="name">adren4line_</div>
        </div>

        <div class="member">
            <img id="avatar-stero" class="avatar" src="steroban.jpg">
            <div class="name">steroban_tv</div>
        </div>

        <div class="member">
            <img id="avatar-serizawa" class="avatar" src="serizawa.jpg">
            <div class="name">serizawa5714</div>
        </div>

    </div>

    <script>
        const streamers = [
            { name: "louloutte_doris", element: "avatar-louloutte" },
            { name: "adren4line_", element: "avatar-adre" },
            { name: "steroban_tv", element: "avatar-stero" },
            { name: "serizawa5714", element: "avatar-serizawa" }
        ];

        const API_URL = "https://decapi.me/twitch/uptime/";

        async function checkLive() {
            for (const s of streamers) {
                const res = await fetch(API_URL + s.name);
                const text = await res.text();

                if (!text.includes("offline")) {
                    const avatar = document.getElementById(s.element);
                    avatar.classList.add("live");
                    avatar.style.cursor = "pointer";
                    avatar.onclick = () => window.open("https://twitch.tv/" + s.name, "_blank");

                    const nameElement = avatar.parentElement.querySelector(".name");
                    nameElement.style.cursor = "pointer";
                    nameElement.onclick = () => window.open("https://twitch.tv/" + s.name, "_blank");
                    nameElement.textContent += " - en live";
                }
            }
        }

        checkLive();
        window.onload = () => document.documentElement.classList.add('loaded');
    </script>

</body>
</html>
