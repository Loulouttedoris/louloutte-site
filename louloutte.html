<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live de Louloutte</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        linear-gradient(rgba(15, 5, 25, 0.78), rgba(15, 5, 25, 0.88)),
        url("https://loulouttedoris.github.io/louloutte-site/background.png")
        center / cover fixed no-repeat;
    text-align: center;
    animation: fadeIn 0.8s ease-in;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

nav {
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 20px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    background: rgba(120, 40, 180, 0.35);
    border: 1px solid #a855f7;
    padding: 10px 18px;
    border-radius: 10px;
    transition: 0.25s;
}

nav a:hover {
    background: rgba(168, 85, 247, 0.65);
    box-shadow: 0 0 15px rgba(168, 85, 247, 0.7);
    transform: translateY(-2px);
}

.container {
    width: 94%;
    max-width: 1050px;
    margin: 30px auto 50px;
    padding: 30px 20px;
    background: rgba(15, 5, 25, 0.65);
    border: 1px solid rgba(168, 85, 247, 0.5);
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(120, 40, 180, 0.25);
}

h1 {
    color: #d8b4fe;
    font-size: 32px;
    margin: 10px 0 25px;
}

.twitch-player {
    width: 100%;
    max-width: 900px;
    height: 500px;
    border: 2px solid #a855f7;
    border-radius: 15px;
    box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
    display: block;
    margin: 0 auto;
}

.social-section {
    margin-top: 35px;
}

.social-section h2 {
    color: #d8b4fe;
    font-size: 22px;
    margin-bottom: 18px;
}

.social-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.social-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 95px;
    padding: 9px 15px;
    border-radius: 10px;
    text-decoration: none;
    color: white;
    font-size: 15px;
    font-weight: bold;
    transition: 0.25s;
}

.social-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
}

.twitch {
    background: #9146ff;
}

.youtube {
    background: #ff0000;
}

.tiktok {
    background: #050505;
    border: 1px solid white;
}

.instagram {
    background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
}

.discord {
    background: #5865f2;
}

.donation-section {
    margin-top: 30px;
    padding-top: 25px;
    border-top: 1px solid rgba(216, 180, 254, 0.25);
}

.donation-section h3 {
    margin-bottom: 15px;
    color: #e9d5ff;
    font-size: 18px;
}

.donation-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 10px;
    background: #7e22ce;
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: 0.25s;
}

.donation-button:hover {
    background: #9333ea;
    transform: translateY(-2px);
    box-shadow: 0 0 18px rgba(168, 85, 247, 0.6);
}

@media (max-width: 700px) {
    .container {
        width: 94%;
        padding: 25px 12px;
        margin-top: 15px;
    }

    h1 {
        font-size: 26px;
    }

    .twitch-player {
        height: 400px;
    }

    .social-btn {
        min-width: 105px;
        padding: 10px 14px;
        font-size: 15px;
    }
}

@media (max-width: 480px) {
    .twitch-player {
        height: 300px;
    }

    nav {
        gap: 8px;
        padding: 15px 10px;
    }

    nav a {
        padding: 9px 13px;
        font-size: 14px;
    }
}
</style>
</head>
