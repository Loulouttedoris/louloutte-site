<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Twitch de Louloutte - Gaming en direct 💜</title>

    <meta name="description" content="Regardez le live Twitch de Louloutte en direct : gaming, bonne humeur et moments chill. Retrouvez également ses réseaux sociaux et soutenez la chaîne. 💜">

    <link rel="canonical" href="https://loulouttedoris.github.io/louloutte-site/louloutte.html">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, sans-serif;
            color: white;
        }

        body {
            background:
                linear-gradient(rgba(20, 5, 35, 0.78), rgba(20, 5, 35, 0.88)),
                url("background.png") center / cover fixed;
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        header {
            padding: 30px 20px 15px;
        }

        .logo {
            width: 180px;
            max-width: 70%;
            height: auto;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 15px auto 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            background: rgba(120, 50, 180, 0.35);
            border: 1px solid rgba(190, 120, 255, 0.5);
            padding: 10px 18px;
            border-radius: 20px;
            transition: 0.25s;
        }

        nav a:hover {
            background: rgba(150, 70, 220, 0.6);
            transform: translateY(-2px);
        }

        main {
            width: min(1000px, 92%);
            margin: auto;
        }

        h1 {
            color: #d9a7ff;
            font-size: 2rem;
            margin-bottom: 25px;
        }

        .stream-container {
            width: 100%;
            background: rgba(20, 10, 35, 0.65);
            border: 1px solid rgba(190, 120, 255, 0.3);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(150, 70, 220, 0.15);
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 12px;
            display: block;
        }

        .team-link {
            display: inline-block;
            margin-top: 18px;
            color: #d9a7ff;
            text-decoration: none;
            font-weight: bold;
            transition: 0.25s;
        }

        .team-link:hover {
            color: white;
            text-decoration: underline;
        }

        .social-section {
            margin-top: 35px;
        }

        .social-section h2 {
            color: #d9a7ff;
            font-size: 1.4rem;
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .social {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            text-decoration: none;
            font-size: 20px;
            transition: 0.25s;
        }

        .social:hover {
            transform: translateY(-3px);
        }

        .twitch {
            background: #9146ff;
        }

        .youtube {
            background: #ff0000;
        }

        .tiktok {
            background: #000;
            border: 1px solid white;
        }

        .instagram {
            background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7);
        }

        .discord {
            background: #5865f2;
        }

        .donation {
            margin: 30px auto 40px;
        }

        .donation p {
            margin-bottom: 12px;
        }

        .donation-button {
            display: inline-block;
            color: white;
            text-decoration: none;
            background: rgba(120, 50, 180, 0.45);
            border: 1px solid rgba(190, 120, 255, 0.5);
            padding: 10px 20px;
            border-radius: 22px;
            transition: 0.25s;
        }

        .donation-button:hover {
            background: rgba(150, 70, 220, 0.65);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            header {
                padding-top: 20px;
            }

            .logo {
                width: 145px;
            }

            h1 {
                font-size: 1.6rem;
            }

            nav a {
                padding: 8px 14px;
                font-size: 0.9rem;
            }

            .stream-container {
                padding: 8px;
            }

            iframe {
                height: 300px;
            }
        }
    </style>
</head>

<body>

<header>
    <img src="logo.png" alt="Logo Louloutte" class="logo">

    <nav>
        <a href="index.html">Accueil</a>

            <a href="https://www.tiktok.com/@louloutte_doris?lang=fr-CA"

            <a href="https://discord.gg/qScrgEYXYw"

                <i class="fa-brands fa-discord"></i>
            </a>

        </div>

    </section>

    <section class="donation">

        <p>
            Envie de soutenir la chaîne ? 💜
        </p>

        <a href="https://streamelements.com/louloutte_doris/tip"
           target="_blank"

           class="donation-button">
            💜 Soutenir la chaîne
        </a>

    </section>

</main>

</body>
</html>
